version: '3.8'

services:
  postgres:
    image: postgres:15
    platform: linux/arm64
    container_name: crm_postgres
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_pass
      POSTGRES_DB: crm_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    platform: linux/arm64
    container_name: crm_redis
    ports:
      - "6379:6379"
      